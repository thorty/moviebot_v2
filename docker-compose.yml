name: moviebot-local

services:
  backend:
    image: python:3.12-slim
    container_name: moviebot-backend
    working_dir: /workspace
    command: sh -c "pip install --no-cache-dir -r requirements-docker.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./:/workspace
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend-web:
    image: node:20-alpine
    container_name: moviebot-frontend-web
    working_dir: /workspace/frontend/web
    environment:
      VITE_SUPABASE_URL: ${SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    command: sh -c "if [ -f package.json ]; then if [ -f .env ]; then set -a; . ./.env; set +a; fi; npm install && npm run dev -- --host 0.0.0.0 --port 3000; else echo 'frontend/web not initialized yet (Task 4). Keeping container alive for Task 1.'; tail -f /dev/null; fi"
    volumes:
      - ./:/workspace
    ports:
      - "3000:3000"
    restart: unless-stopped
